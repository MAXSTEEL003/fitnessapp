<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Electric Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Shred Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="30%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Chrome Metallic Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Internal Glow -->
  <circle cx="256" cy="270" r="140" fill="#3b82f6" opacity="0.22" filter="url(#softGlow)" />
  <circle cx="280" cy="230" r="110" fill="#f97316" opacity="0.25" filter="url(#softGlow)" />

  <!-- Dumbbell Core (Angled Athletic Stance) -->
  <g transform="rotate(-28 256 256)">
    <!-- Dumbbell Central Bar -->
    <rect x="140" y="242" width="232" height="28" rx="14" fill="url(#chromeGrad)" />
    <!-- Bar Knurling Grips -->
    <rect x="220" y="240" width="72" height="32" rx="6" fill="#334155" opacity="0.6" stroke="rgba(255,255,255,0.3)" stroke-width="2" />

    <!-- Left Inner Collar -->
    <rect x="175" y="222" width="14" height="68" rx="6" fill="url(#chromeGrad)" />
    <!-- Left Inner Weight Plate -->
    <rect x="135" y="196" width="32" height="120" rx="12" fill="url(#blueGrad)" filter="url(#glow)" />
    <!-- Left Outer Weight Plate -->
    <rect x="95" y="210" width="32" height="92" rx="10" fill="url(#blueGrad)" opacity="0.9" />

    <!-- Right Inner Collar -->
    <rect x="323" y="222" width="14" height="68" rx="6" fill="url(#chromeGrad)" />
    <!-- Right Inner Weight Plate -->
    <rect x="345" y="196" width="32" height="120" rx="12" fill="url(#blueGrad)" filter="url(#glow)" />
    <!-- Right Outer Weight Plate -->
    <rect x="385" y="210" width="32" height="92" rx="10" fill="url(#blueGrad)" opacity="0.9" />
  </g>

  <!-- Energetic Shred Flame & Lightning Slash -->
  <g filter="url(#glow)">
    <!-- Dynamic Shred Flame Silhouette Overlay -->
    <path d="M 276 96
             C 285 140, 332 170, 345 220
             C 356 265, 334 315, 290 345
             C 264 362, 230 365, 205 348
             C 192 339, 185 322, 192 308
             C 198 296, 214 290, 226 280
             C 246 264, 258 240, 252 214
             C 248 198, 236 182, 238 162
             C 240 142, 254 116, 276 96 Z"
          fill="url(#flameGrad)" />

    <!-- Inner Hot Core Lightning Flare -->
    <path d="M 268 135
             C 276 170, 312 210, 310 252
             C 308 280, 286 312, 258 322
             C 242 328, 228 322, 224 310
             C 238 294, 260 280, 262 250
             C 264 224, 250 200, 254 175
             C 256 160, 262 146, 268 135 Z"
          fill="#ffffff" opacity="0.85" />
  </g>

  <!-- High-tech Energy Sparkles -->
  <circle cx="160" cy="140" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="370" cy="380" r="6" fill="#fb923c" filter="url(#glow)" />
  <circle cx="390" cy="160" r="4" fill="#fde047" filter="url(#glow)" />
</svg>
